name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN_CONFIGURED: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: node scripts/verify-release.mjs
      - run: bun run ci
      - run: bun run verify:package
      - name: Publish with bootstrap token
        if: env.NPM_TOKEN_CONFIGURED == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish with Trusted Publishing
        if: env.NPM_TOKEN_CONFIGURED != 'true'
        run: npm publish --provenance --access public
